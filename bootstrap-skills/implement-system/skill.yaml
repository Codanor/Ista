id: meta-implement-system
name: implement-system
description: Scaffolds a new Ista compiler for a system that isn't built in yet, fills it in, registers it, and sanity-checks its CapabilityReport against a sample skill
version: 0.1.0
trigger:
  keywords: [implement system, new compiler, ista system scaffold, add compiler]
  always_on: false
scope: project
priority: 0
capabilities:
  reads_files: true
  writes_files: true
  network: false
  shell_exec: true
  tools: [ista]
  spawn_subagents: false
  approval: required
body: body.md
attachments: []
resources: []
scripts: []
systems:
  claude:
    enabled: true
    overrides: {}
